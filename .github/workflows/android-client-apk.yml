name: Android Client APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/live-refresh-3d-globe
    paths:
      - 'android-client/**'
      - '.github/workflows/android-client-apk.yml'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build test APK
        working-directory: android-client
        run: gradle --no-daemon assembleDebug
      - name: Publish APK for direct website download
        run: |
          mkdir -p syncdark/public/downloads
          cp android-client/app/build/outputs/apk/debug/app-debug.apk syncdark/public/downloads/syncdark-android-test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syncdark/public/downloads/syncdark-android-test.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; skipping commit."
          else
            git commit -m "Publish Android test APK for direct download"
            git pull --rebase origin feature/live-refresh-3d-globe
            git push
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncdark-android-test-apk
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
