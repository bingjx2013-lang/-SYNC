name: Android Client APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/live-refresh-3d-globe
    paths:
      - 'android-client/**'
      - '.github/workflows/android-client-apk.yml'

permissions:
  contents: write

concurrency:
  group: syncdark-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-apk:
    # The publisher writes to the Render-connected release branch; never run it from a feature/PR branch.
    if: github.ref == 'refs/heads/feature/live-refresh-3d-globe'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Require stable Android signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SYNCDARK_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SYNCDARK_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SYNCDARK_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SYNCDARK_ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=("SYNCDARK_ANDROID_KEYSTORE_BASE64")
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=("SYNCDARK_ANDROID_KEYSTORE_PASSWORD")
          [[ -n "$KEY_ALIAS" ]] || missing+=("SYNCDARK_ANDROID_KEY_ALIAS")
          [[ -n "$KEY_PASSWORD" ]] || missing+=("SYNCDARK_ANDROID_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::APK publishing is blocked until a persistent signing key is configured."
            printf 'Missing GitHub Actions secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install persistent signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SYNCDARK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android-client/.signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-client/.signing/syncdark-release.jks
          chmod 600 android-client/.signing/syncdark-release.jks
          test -s android-client/.signing/syncdark-release.jks

      - name: Build release APK with persistent signature
        working-directory: android-client
        env:
          SYNCDARK_KEYSTORE_FILE: ${{ github.workspace }}/android-client/.signing/syncdark-release.jks
          SYNCDARK_KEYSTORE_PASSWORD: ${{ secrets.SYNCDARK_ANDROID_KEYSTORE_PASSWORD }}
          SYNCDARK_KEY_ALIAS: ${{ secrets.SYNCDARK_ANDROID_KEY_ALIAS }}
          SYNCDARK_KEY_PASSWORD: ${{ secrets.SYNCDARK_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          APK="android-client/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Generate verified metadata and publish test prerelease
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          APK="android-client/app/build/outputs/apk/release/app-release.apk"
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\\1/p" android-client/app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\\1/p' android-client/app/build.gradle | head -n1)"
          [[ "$VERSION_NAME" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          if gh release view "$VERSION_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; increment versionName/versionCode before another build."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/syncdark-release"
          cp "$APK" "$RUNNER_TEMP/syncdark-release/syncdark-android.apk"
          SIZE_BYTES="$(stat -c '%s' "$RUNNER_TEMP/syncdark-release/syncdark-android.apk")"
          SHA256="$(sha256sum "$RUNNER_TEMP/syncdark-release/syncdark-android.apk" | awk '{print $1}')"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          VERSION_NAME="$VERSION_NAME" VERSION_CODE="$VERSION_CODE" SIZE_BYTES="$SIZE_BYTES" SHA256="$SHA256" PUBLISHED_AT="$PUBLISHED_AT" node - "$RUNNER_TEMP/syncdark-release/android-version.json" <<'NODE'
          const fs = require('node:fs');
          const [out] = process.argv.slice(2);
          fs.writeFileSync(out, JSON.stringify({
            versionName: process.env.VERSION_NAME,
            versionCode: Number(process.env.VERSION_CODE),
            sizeBytes: Number(process.env.SIZE_BYTES),
            sha256: process.env.SHA256,
            publishedAt: process.env.PUBLISHED_AT
          }, null, 2) + '\\n');
          NODE
          gh release create "$VERSION_NAME" \\
            "$RUNNER_TEMP/syncdark-release/syncdark-android.apk#SYNC Android APK" \\
            "$RUNNER_TEMP/syncdark-release/android-version.json#Android version manifest" \\
            --repo "$GITHUB_REPOSITORY" \\
            --target feature/live-refresh-3d-globe \\
            --title "SYNC Android $VERSION_NAME" \\
            --notes "Signed SYNC Android test build. The updater validates APK size and SHA-256 before installing. Test prerelease only; not a production deployment." \\
            --prerelease

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncdark-android-test-apk-signed
          path: android-client/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -rf android-client/.signing
