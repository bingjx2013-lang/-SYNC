name: Android Mesh APK CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/live-refresh-3d-globe
    paths:
      - 'android-client/**'
      - '.github/workflows/android-mesh-ci.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile Android debug APK
        working-directory: android-client
        run: gradle --no-daemon assembleDebug

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncdark-android-mesh-debug-apk
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
